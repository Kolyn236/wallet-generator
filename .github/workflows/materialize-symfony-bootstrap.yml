name: Materialize Symfony bootstrap

on:
  push:
    branches:
      - build/symfony-bootstrap

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/symfony-bootstrap
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Resolve Symfony dependencies and Flex recipes
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Commit deterministic bootstrap files
        working-directory: .
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/composer.json \
            backend/composer.lock \
            backend/symfony.lock \
            backend/.editorconfig \
            backend/.gitignore \
            backend/bin/phpunit \
            backend/config/packages/cache.yaml \
            backend/config/packages/routing.yaml \
            backend/config/preload.php \
            backend/config/routes/framework.yaml
          if git diff --cached --quiet; then
            echo 'No bootstrap files changed.'
            exit 0
          fi
          git commit -m 'build(symfony): lock dependencies and Flex recipes'
          git push origin HEAD:build/symfony-bootstrap
