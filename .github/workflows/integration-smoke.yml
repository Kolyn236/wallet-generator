name: Integration Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'compose.yaml'
      - 'deploy/**'
      - 'scripts/build-deploy-env.sh'
      - '.env.example'
      - 'backend/.env'
      - 'backend/.env.example'
      - 'backend/config/**'
      - 'backend/composer.json'
      - 'backend/composer.lock'
      - 'frontend/**'
      - '.github/workflows/integration-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose topology
        run: docker compose config --quiet

      - name: Smoke test deploy env and local runtime
        run: |
          set -eu

          cat > /tmp/wallet-rates.env <<'EOF'
          DOGE_RECOMMENDED_FEE_RATE=0.01234567
          BTC_RECOMMENDED_FEE_RATE=0.00023456
          EOF

          sh scripts/build-deploy-env.sh /tmp/wallet-rates.env .env
          test "$(grep -c '^DOGE_RECOMMENDED_FEE_RATE=' .env)" -eq 1
          test "$(grep -c '^BTC_RECOMMENDED_FEE_RATE=' .env)" -eq 1
          grep -qx 'DOGE_RECOMMENDED_FEE_RATE=0.01234567' .env
          grep -qx 'BTC_RECOMMENDED_FEE_RATE=0.00023456' .env

          docker compose up -d --build
          trap 'docker compose down -v; rm -f .env' EXIT

          for attempt in $(seq 1 30); do
            if docker compose exec -T --user www-data php sh -c 'test -w var/cache && test -w var/log' \
              && docker compose exec -T php php bin/console debug:router api_dogecoin_fee_policy >/dev/null 2>&1 \
              && docker compose exec -T php php bin/console debug:router api_bitcoin_fee_policy >/dev/null 2>&1 \
              && docker compose exec -T php php bin/console debug:router api_ethereum_balance >/dev/null 2>&1 \
              && docker compose exec -T php php bin/console debug:router api_ethereum_prepare >/dev/null 2>&1 \
              && docker compose exec -T php php bin/console debug:router api_ethereum_broadcast >/dev/null 2>&1 \
              && curl --fail --silent --show-error -H 'Accept: application/json' http://localhost:8080/api/health >/dev/null \
              && curl --fail --silent --show-error -H 'Accept: application/json' -D /tmp/doge-fee-policy.headers -o /tmp/doge-fee-policy.json http://localhost:8080/api/chains/dogecoin/mainnet/fee-policy \
              && curl --fail --silent --show-error -H 'Accept: application/json' -D /tmp/btc-fee-policy.headers -o /tmp/btc-fee-policy.json http://localhost:8080/api/chains/bitcoin/mainnet/fee-policy \
              && node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('/tmp/doge-fee-policy.json','utf8')); if (data.recommendedRate !== '0.01234567' || data.unit !== 'DOGE/kB') throw new Error('Unexpected DOGE fee policy: '+JSON.stringify(data));" \
              && node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('/tmp/btc-fee-policy.json','utf8')); if (data.recommendedRate !== '0.00023456' || data.unit !== 'BTC/kB') throw new Error('Unexpected BTC fee policy: '+JSON.stringify(data));"; then
              exit 0
            fi
            sleep 1
          done

          echo '--- Symfony routes ---'
          docker compose exec -T php php bin/console debug:router api_dogecoin_fee_policy || true
          docker compose exec -T php php bin/console debug:router api_bitcoin_fee_policy || true
          docker compose exec -T php php bin/console debug:router api_ethereum_balance || true
          docker compose exec -T php php bin/console debug:router api_ethereum_prepare || true
          docker compose exec -T php php bin/console debug:router api_ethereum_broadcast || true
          echo '--- DOGE fee policy ---'
          cat /tmp/doge-fee-policy.headers 2>/dev/null || true
          head -c 2000 /tmp/doge-fee-policy.json 2>/dev/null || true
          echo
          echo '--- BTC fee policy ---'
          cat /tmp/btc-fee-policy.headers 2>/dev/null || true
          head -c 2000 /tmp/btc-fee-policy.json 2>/dev/null || true
          echo
          echo '--- Containers ---'
          docker compose logs
          exit 1
