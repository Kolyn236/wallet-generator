services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app/backend
    command: sh -c "composer install --no-interaction --prefer-dist && php-fpm"
    volumes:
      - ./:/app
    environment:
      APP_ENV: dev
      APP_DEBUG: '1'
      APP_SECRET: local-development-only-change-me

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - php
