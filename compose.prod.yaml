name: chain-courier-production

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    working_dir: /app/backend
    environment:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required for the production runtime}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost:8080}
      DOGE_RECOMMENDED_FEE_RATE: ${DOGE_RECOMMENDED_FEE_RATE:-0.01}
      BTC_RECOMMENDED_FEE_RATE: ${BTC_RECOMMENDED_FEE_RATE:-0.00010000}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - '${HTTP_PORT:-8080}:80'
    depends_on:
      - php
    restart: unless-stopped
