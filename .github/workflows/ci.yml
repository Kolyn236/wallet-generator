name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: test
      APP_DEBUG: '1'
      APP_SECRET: ci-test-secret-not-for-production
      DEFAULT_URI: http://localhost
      DOGE_RECOMMENDED_FEE_RATE: '0.01'
      BTC_RECOMMENDED_FEE_RATE: '0.00010000'
      ETHEREUM_RPC_URL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enforce repository security guardrails
        run: python3 scripts/check-repository-security.py

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Lint PHP syntax
        working-directory: backend
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate Composer metadata
        working-directory: backend
        run: composer validate --strict

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit backend production dependencies
        working-directory: backend
        run: composer audit --locked --no-dev --abandoned=report

      - name: Run PHPUnit
        working-directory: backend
        run: composer test

      - name: Run PHPStan
        working-directory: backend
        run: composer analyse

      - name: Check backend code style
        working-directory: backend
        run: composer cs:check

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Run frontend adapter registry invariants
        working-directory: frontend
        run: npm run test:adapter-invariants

      - name: Run Dogecoin deterministic vector
        working-directory: frontend
        run: npm run test:dogecoin-vector

      - name: Run Bitcoin deterministic vector
        working-directory: frontend
        run: npm run test:bitcoin-vector

      - name: Run Litecoin deterministic vector
        working-directory: frontend
        run: npm run test:litecoin-vector

      - name: Run Ethereum deterministic vector
        working-directory: frontend
        run: npm run test:ethereum-vector

      - name: Run USDT ERC-20 deterministic vector
        working-directory: frontend
        run: npm run test:usdt-erc20-vector

      - name: Build frontend
        working-directory: frontend
        run: npm run build
