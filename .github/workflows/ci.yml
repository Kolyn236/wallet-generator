name: CI

on:
  push:
  pull_request:

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Dogecoin reference self-test
        run: python3 doge_wallet.py --self-test

  symfony-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPUnit
        run: composer test
      - name: Run PHPStan
        run: composer analyse
      - name: Check code style
        run: composer cs:check

  react-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Validate Compose topology
        working-directory: .
        run: docker compose config --quiet
      - name: Smoke test local runtime
        working-directory: .
        run: |
          set -eu
          DOGE_RECOMMENDED_FEE_RATE=0.01234567 docker compose up -d --build
          trap 'docker compose down -v' EXIT

          for attempt in $(seq 1 30); do
            if docker compose exec -T --user www-data php sh -c 'test -w var/cache && test -w var/log' \
              && docker compose exec -T php php bin/console debug:router api_dogecoin_fee_policy >/dev/null 2>&1 \
              && curl --fail --silent --show-error -H 'Accept: application/json' http://localhost:8080/api/health >/dev/null \
              && curl --fail --silent --show-error -H 'Accept: application/json' -D /tmp/doge-fee-policy.headers -o /tmp/doge-fee-policy.json http://localhost:8080/api/chains/dogecoin/mainnet/fee-policy \
              && python3 -c "import json; data=json.load(open('/tmp/doge-fee-policy.json')); assert data['recommendedRate'] == '0.01234567'; assert data['unit'] == 'DOGE/kB'"; then
              exit 0
            fi
            sleep 1
          done

          echo '--- Symfony route ---'
          docker compose exec -T php php bin/console debug:router api_dogecoin_fee_policy || true
          echo '--- Fee policy headers ---'
          cat /tmp/doge-fee-policy.headers 2>/dev/null || true
          echo '--- Fee policy body ---'
          head -c 2000 /tmp/doge-fee-policy.json 2>/dev/null || true
          echo
          echo '--- Containers ---'
          docker compose logs
          exit 1
      - name: Build platform Nginx image
        working-directory: .
        run: docker build --file docker/nginx/Dockerfile --tag wallet-platform-nginx:test .
