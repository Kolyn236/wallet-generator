name: Integration Smoke

on:
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'compose.yaml'
      - 'compose.prod.yaml'
      - '.dockerignore'
      - 'scripts/build-deploy-env.sh'
      - '.env.example'
      - 'deploy/**'
      - 'backend/.env.example'
      - 'backend/config/**'
      - 'backend/composer.json'
      - 'backend/composer.lock'
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/tsconfig.json'
      - 'frontend/vite.config.ts'
      - '.github/workflows/integration-smoke.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'compose.yaml'
      - 'compose.prod.yaml'
      - '.dockerignore'
      - 'scripts/build-deploy-env.sh'
      - '.env.example'
      - 'deploy/**'
      - 'backend/.env.example'
      - 'backend/config/**'
      - 'backend/composer.json'
      - 'backend/composer.lock'
      - 'frontend/src/**'
      - 'frontend/index.html'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/tsconfig.json'
      - 'frontend/vite.config.ts'
      - '.github/workflows/integration-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate development Compose topology
        run: docker compose config --quiet

      - name: Validate production Compose fails closed without secret
        run: |
          set -eu
          rm -f .env
          if env -u APP_SECRET docker compose -f compose.prod.yaml config --quiet >/tmp/prod-no-secret.log 2>&1; then
            echo 'Production Compose unexpectedly resolved without APP_SECRET' >&2
            exit 1
          fi
          grep -q 'APP_SECRET' /tmp/prod-no-secret.log

      - name: Validate production Compose invariants
        env:
          APP_SECRET: ci-production-secret-0123456789abcdef0123456789abcdef
        run: |
          set -eu
          docker compose -f compose.prod.yaml config --format json > /tmp/prod-compose.json
          jq -e '.services.php.environment.APP_ENV == "prod"' /tmp/prod-compose.json
          jq -e '.services.php.environment.APP_DEBUG == "0"' /tmp/prod-compose.json
          jq -e '.services.php.build.target == "production"' /tmp/prod-compose.json
          jq -e '((.services.php.volumes // []) | length) == 0' /tmp/prod-compose.json
          if grep -q 'start-dev.sh' /tmp/prod-compose.json; then
            echo 'Production Compose must not reference start-dev.sh' >&2
            exit 1
          fi

      - name: Build deploy env
        run: |
          set -eu
          cat > /tmp/chain-courier-runtime.env <<'EOF'
          APP_SECRET=ci-production-secret-0123456789abcdef0123456789abcdef
          DOGE_RECOMMENDED_FEE_RATE=0.01234567
          BTC_RECOMMENDED_FEE_RATE=0.00023456
          EOF

          sh scripts/build-deploy-env.sh /tmp/chain-courier-runtime.env .env
          test "$(grep -c '^APP_SECRET=' .env)" -eq 1
          test "$(grep -c '^DOGE_RECOMMENDED_FEE_RATE=' .env)" -eq 1
          test "$(grep -c '^BTC_RECOMMENDED_FEE_RATE=' .env)" -eq 1
          grep -qx 'DOGE_RECOMMENDED_FEE_RATE=0.01234567' .env
          grep -qx 'BTC_RECOMMENDED_FEE_RATE=0.00023456' .env

      - name: Build and start production runtime
        run: |
          set -eu
          docker compose -f compose.prod.yaml up -d --build

          php_image=$(docker compose -f compose.prod.yaml images -q php)
          image_runtime=$(docker image inspect "$php_image" --format '{{json .Config.Entrypoint}} {{json .Config.Cmd}}')
          echo "$image_runtime" | grep -q '/usr/local/bin/start-prod'
          echo "$image_runtime" | grep -q 'php-fpm'
          if echo "$image_runtime" | grep -q 'start-dev.sh'; then
            echo 'Production PHP image unexpectedly uses start-dev.sh' >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error -H 'Accept: application/json' http://localhost:8080/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          echo 'Production health endpoint did not become ready' >&2
          docker compose -f compose.prod.yaml ps
          docker compose -f compose.prod.yaml logs
          exit 1

      - name: Validate production PHP runtime
        run: |
          set -eu
          docker compose -f compose.prod.yaml exec -T php sh -c 'test "$APP_ENV" = prod && test "$APP_DEBUG" = 0'
          docker compose -f compose.prod.yaml exec -T php sh -c 'test ! -d vendor/phpunit/phpunit && test ! -d vendor/phpstan/phpstan'
          docker compose -f compose.prod.yaml exec -T php php -r 'exit(ini_get("opcache.enable") === "1" ? 0 : 1);'
          docker compose -f compose.prod.yaml exec -T php php bin/console debug:router api_dogecoin_fee_policy >/dev/null
          docker compose -f compose.prod.yaml exec -T php php bin/console debug:router api_bitcoin_fee_policy >/dev/null
          docker compose -f compose.prod.yaml exec -T php php bin/console debug:router api_ethereum_balance >/dev/null

      - name: Validate Nginx and application smoke
        run: |
          set -eu
          docker compose -f compose.prod.yaml exec -T nginx nginx -t
          curl --fail --silent --show-error http://localhost:8080/ | grep -q 'ChainCourier'
          curl --fail --silent --show-error -H 'Accept: application/json' -o /tmp/doge-fee-policy.json http://localhost:8080/api/chains/dogecoin/mainnet/fee-policy
          curl --fail --silent --show-error -H 'Accept: application/json' -o /tmp/btc-fee-policy.json http://localhost:8080/api/chains/bitcoin/mainnet/fee-policy
          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('/tmp/doge-fee-policy.json','utf8')); if (data.recommendedRate !== '0.01234567' || data.unit !== 'DOGE/kB') throw new Error('Unexpected DOGE fee policy: '+JSON.stringify(data));"
          node -e "const fs=require('node:fs'); const data=JSON.parse(fs.readFileSync('/tmp/btc-fee-policy.json','utf8')); if (data.recommendedRate !== '0.00023456' || data.unit !== 'BTC/kB') throw new Error('Unexpected BTC fee policy: '+JSON.stringify(data));"

      - name: Validate request body limit
        run: |
          set -eu
          body_status=$(dd if=/dev/zero bs=1024 count=300 2>/dev/null | curl --silent --show-error -o /tmp/body-limit-response -w '%{http_code}' -X POST -H 'Content-Type: application/octet-stream' --data-binary @- http://localhost:8080/api/health)
          test "$body_status" = '413'

      - name: Validate API rate limit regression
        run: |
          set -eu
          seq 1 100 | xargs -P 50 -I{} curl --silent --output /dev/null --write-out '%{http_code}\n' http://localhost:8080/api/health > /tmp/rate-codes
          sort /tmp/rate-codes | uniq -c
          grep -qx '200' /tmp/rate-codes
          grep -qx '429' /tmp/rate-codes

      - name: Tear down production runtime
        if: always()
        run: |
          docker compose -f compose.prod.yaml down -v || true
          rm -f .env
