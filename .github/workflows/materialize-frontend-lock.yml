name: Materialize frontend lock

on:
  push:
    branches:
      - feat/react-frontend-bootstrap

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/react-frontend-bootstrap
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve frontend dependencies
        working-directory: frontend
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit dependency lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo 'No package-lock changes.'
            exit 0
          fi
          git commit -m 'build(frontend): lock npm dependencies'
          git push origin HEAD:feat/react-frontend-bootstrap
