services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /app/backend
    command: sh /app/docker/php/start-dev.sh
    volumes:
      - ./:/app
      - backend-var:/app/backend/var
    environment:
      APP_ENV: dev
      APP_DEBUG: '1'
      APP_SECRET: local-development-only-change-me
      DEFAULT_URI: http://localhost:8080
      DOGE_RECOMMENDED_FEE_RATE: ${DOGE_RECOMMENDED_FEE_RATE:-0.01}
      BTC_RECOMMENDED_FEE_RATE: ${BTC_RECOMMENDED_FEE_RATE:-0.00010000}
      ETHEREUM_RPC_URL: ${ETHEREUM_RPC_URL:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - php

volumes:
  backend-var:
