limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    error_page 429 = @edge_rate_limited;

    location ^~ /api/ {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_req_status 429;

        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/backend/public;
    }

    location @edge_rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error":"rate_limited","reason":"edge_limit"}';
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~ \.php$ {
        return 404;
    }
}
