version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      frontend-routine:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "*"
        exclude-patterns:
          - "@noble/*"
          - "@scure/*"
        update-types:
          - minor
          - patch
      frontend-dev-routine:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      symfony-routine:
        applies-to: version-updates
        dependency-type: production
        patterns:
          - "symfony/*"
        update-types:
          - minor
          - patch
      backend-dev-routine:
        applies-to: version-updates
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      actions-routine:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
