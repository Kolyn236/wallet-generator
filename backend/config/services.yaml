parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

    App\Blockchain\Application\DogecoinFeePolicy:
        arguments:
            $recommendedRateDogePerKb: '%env(string:DOGE_RECOMMENDED_FEE_RATE)%'

    App\Blockchain\Application\DogecoinBalanceProvider:
        alias: App\Blockchain\Infrastructure\BlockCypherDogecoinBalanceProvider

    App\Blockchain\Application\DogecoinUtxoProvider:
        alias: App\Blockchain\Infrastructure\BlockCypherDogecoinUtxoProvider

    App\Blockchain\Application\DogecoinTransactionBroadcaster:
        alias: App\Blockchain\Infrastructure\BlockCypherDogecoinTransactionBroadcaster
