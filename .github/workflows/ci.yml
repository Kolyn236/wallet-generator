name: CI

on:
  push:
  pull_request:

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Dogecoin reference self-test
        run: python3 doge_wallet.py --self-test

  symfony-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run PHPUnit
        run: composer test
      - name: Run PHPStan
        run: composer analyse
      - name: Check code style
        run: composer cs:check

  react-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Validate Compose topology
        working-directory: .
        run: docker compose config --quiet
      - name: Build platform Nginx image
        working-directory: .
        run: docker build --file docker/nginx/Dockerfile --tag wallet-platform-nginx:test .
