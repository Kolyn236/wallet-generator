name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.27'
          coverage: none
          tools: composer:v2

      - name: Assert patched PHP runtime
        run: php -r 'exit(version_compare(PHP_VERSION, "8.4.27", ">=") ? 0 : 1);'

      - name: Lint PHP syntax
        working-directory: backend
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate Composer metadata
        working-directory: backend
        run: composer validate --strict

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPUnit
        working-directory: backend
        run: composer test

      - name: Run PHPStan
        working-directory: backend
        run: composer analyse

      - name: Check backend code style
        working-directory: backend
        run: composer cs:check

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend adapter registry invariants
        working-directory: frontend
        run: npm run test:adapter-invariants

      - name: Run Dogecoin deterministic vector
        working-directory: frontend
        run: npm run test:dogecoin-vector

      - name: Run Bitcoin deterministic vector
        working-directory: frontend
        run: npm run test:bitcoin-vector

      - name: Run Litecoin deterministic vector
        working-directory: frontend
        run: npm run test:litecoin-vector

      - name: Run Ethereum deterministic vector
        working-directory: frontend
        run: npm run test:ethereum-vector

      - name: Run USDT ERC-20 deterministic vector
        working-directory: frontend
        run: npm run test:usdt-erc20-vector

      - name: Run TRON, publication and UI security regressions
        working-directory: frontend
        run: npm run test:tron-vector && npm run test:tron-flow && npm run test:broadcast && npm run test:usdt-route-chooser && npm run test:transfer-review && npm run test:public-runtime

      - name: Build frontend
        working-directory: frontend
        run: npm run build
